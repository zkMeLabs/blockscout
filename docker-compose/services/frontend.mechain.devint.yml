version: "3.9"

services:
  frontend:
    container_name: "blockscout-frontend"
    image: hub.bitkinetic.com/mechain/frontend:${FRONTEND_DOCKER_TAG:-latest}
    pull_policy: always
    platform: linux/amd64
    restart: always
    environment:
      ENVS_PRESET: "me"
    env_file:
      - ../envs/common-frontend.mechain.devint.env
      - /data/frontend/.env.secrets
    volumes:
      - /data/frontend/configs/envs:/app/configs/envs:ro
